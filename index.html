  <title>Students Uran | Applications Closed</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b35, #123d5b);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.3);
    }

    img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 14px;
      display: block;
      margin: 0 auto 22px;
    }

    h1 {
      font-size: clamp(25px, 6vw, 36px);
      line-height: 1.35;
      margin: 10px 0 18px;
    }

    .status {
      display: inline-block;
      padding: 8px 15px;
      background: #e5a93d;
      color: #17202b;
      border-radius: 30px;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 14px;
    }

    p {
      color: #d6e2ee;
      line-height: 1.6;
      margin-bottom: 8px;
    }

    footer {
      margin-top: 25px;
      font-size: 12px;
      color: #a9bfd3;
    }

    .insta-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      z-index: 1000;
      transition: transform 0.2s ease;
    }

    .insta-float:hover {
      transform: scale(1.1);
    }

    .insta-float svg {
      width: 30px;
      height: 30px;
    }
  </style>
